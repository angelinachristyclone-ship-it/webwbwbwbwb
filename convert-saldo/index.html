    <style>

        html, body {

        .container {

        .nav-cat-btn.home-btn {

        /* SUBTAB SWITCHER (FOTO 3 & 4 STYLE) */

            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-sub);

<body>

    <script>
        const BACKEND_API = "https://shinezzzz-gokgokgogkgokgok.hf.space";
        let botPricing = { discounts: {}, product_changes: {} };

        // 100% EXCEL DATA CONVERT SALDO & MASA AKTIF
        const EXCEL_CONVERT_GROUPED = {

            ],

            ],

                { name: "DANA 1.000", price: 1900 },

                { name: "DANA 60.000", price: 62900 },

                { name: "DANA 90.000", price: 93200 },
                { name: "DANA 100.000", price: 104200 },
                { name: "DANA 150.000", price: 154600 },
                { name: "DANA 200.000", price: 204900 }
            ]
        };

        let currentSubtab = 'pulsa';

        function switchConvertSubtab(key, btn) {
            currentSubtab = key;
            document.querySelectorAll('.subtab-pill').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderItems(key);
        }

        function renderItems(key) {
            const container = document.getElementById('convert-items-grid');
            container.innerHTML = '';
            const items = EXCEL_CONVERT_GROUPED[key] || [];
            const disc = (botPricing.discounts && botPricing.discounts['5']) || 0;

            items.forEach(item => {
                let finalPrice = item.price;
                let strikeHtml = '';

                if (disc > 0) {
                    finalPrice = Math.round(item.price * (1 - disc / 100));
                    strikeHtml = `<span class="strike-price">Rp ${item.price.toLocaleString('id-ID')}</span>`;
                }

                const card = document.createElement('div');
                card.className = 'nominal-item-card';
                card.onclick = () => redirectOrderTele('Convert Saldo', item.name, finalPrice);
                card.innerHTML = `
                    ${disc > 0 ? `<div class="discount-badge">-${disc}%</div><div class="discount-timer">⏱️ 01:59:45</div>` : ''}
                    <div class="nominal-item-name">${item.name}</div>
                    <div class="nominal-item-price">${strikeHtml}<span class="discounted-price">Rp ${finalPrice.toLocaleString('id-ID')}</span></div>
                `;
                container.appendChild(card);
            });
        }

        function redirectOrderTele(cat, itemName, price) {
            const text = `Halo bos, gw mau order [${cat}] - [${itemName}] (Rp ${price.toLocaleString('id-ID')}). Minta instruksi bayar Qris dinamis dong!`;
            window.open(`https://t.me/chokoretoangelina?text=` + encodeURIComponent(text), '_blank');
        }

        async function loadBotPricing() {
            try {
                const res = await fetch(BACKEND_API + "/get_pricing");
                if (res.ok) {
                    const json = await res.json();
                    const data = json.data || json;
                    botPricing.discounts = data.discounts || {};
                    botPricing.price_changes = data.price_changes || {};

                    const discData = botPricing.discounts['5'];
                    const percent = typeof discData === 'object' ? (discData.percent || 0) : parseInt(discData) || 0;
                    const ttl = typeof discData === 'object' ? (discData.ttl_seconds || 7200) : 7200;

                    renderItems(currentSubtab);
                    if (percent > 0) {
                        startCountdownClock(ttl);
                    }
                }
            } catch(e) {}
        }

        let countdownInterval = null;
        function startCountdownClock(initialSeconds) {
            if (countdownInterval) clearInterval(countdownInterval);
            let remaining = initialSeconds;

            function updateDisplay() {
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    return;
                }
                const hrs = String(Math.floor(remaining / 3600)).padStart(2, '0');
                const mins = String(Math.floor((remaining % 3600) / 60)).padStart(2, '0');
                const secs = String(remaining % 60).padStart(2, '0');
                document.querySelectorAll('.discount-timer').forEach(el => {
                    el.innerText = `⏱️ ${hrs}:${mins}:${secs}`;
                });
                remaining--;
            }

            updateDisplay();
            countdownInterval = setInterval(updateDisplay, 1000);
        }

        // ================= MAGHRIB TWILIGHT CELESTIAL CANVAS =================
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        let scrollRatio = 0;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function getScrollRatio() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
            const scrollHeight = Math.max(
                document.body.scrollHeight, document.documentElement.scrollHeight,
                document.body.offsetHeight, document.documentElement.offsetHeight
            ) || 1;
            const clientHeight = window.innerHeight || document.documentElement.clientHeight || 1;
            const maxScroll = Math.max(1, scrollHeight - clientHeight);
            return Math.min(1.0, Math.max(0, scrollTop / maxScroll));
        }

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 2.2 + 0.8;
                this.speed = Math.random() * 0.015 + 0.005;
                this.alpha = Math.random();
                this.dir = Math.random() > 0.5 ? 1 : -1;
            }
            update() {
                this.alpha += this.speed * this.dir;
                if (this.alpha >= 1) { this.alpha = 1; this.dir = -1; }
                else if (this.alpha <= 0.2) { this.alpha = 0.2; this.dir = 1; }
            }
            draw(fade) {
                if (fade <= 0.01) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * fade})`;
                ctx.fill();
            }
        }

        class Cloud {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * (width + 400) - 200;
                this.y = Math.random() * (height * 0.65);
                this.radius = Math.random() * 95 + 60;
                this.speed = Math.random() * 0.5 + 0.2;
                this.opacity = Math.random() * 0.4 + 0.25;
            }
            update() {
                this.x += this.speed;
                if (this.x - this.radius > width) {
                    this.x = -this.radius;
                    this.y = Math.random() * (height * 0.65);
                }
            }
            draw(fade, isMaghrib) {
                if (fade <= 0.01) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                if (isMaghrib) {
                    g.addColorStop(0, `rgba(70, 30, 45, ${this.opacity * fade * 0.8})`);
                    g.addColorStop(0.65, `rgba(180, 70, 30, ${this.opacity * fade * 0.4})`);
                    g.addColorStop(1, `rgba(0, 0, 0, 0)`);
                } else {
                    g.addColorStop(0, `rgba(255, 255, 255, ${this.opacity * fade})`);
                    g.addColorStop(0.7, `rgba(240, 248, 255, ${this.opacity * 0.5 * fade})`);
                    g.addColorStop(1, `rgba(255, 255, 255, 0)`);
                }
                ctx.fillStyle = g;
                ctx.fill();
            }
        }

        let starList = [];
        let cloudList = [];

        function initParticles() {
            starList = [];
            cloudList = [];
            for (let i = 0; i < 350; i++) starList.push(new Star());
            for (let i = 0; i < 35; i++) cloudList.push(new Cloud());
        }

        function lerpColor(r1, g1, b1, r2, g2, b2, t) {
            const r = Math.round(r1 + (r2 - r1) * t);
            const g = Math.round(g1 + (g2 - g1) * t);
            const b = Math.round(b1 + (b2 - b1) * t);
            return `rgb(${r}, ${g}, ${b})`;
        }

        function renderLoop() {
            scrollRatio += (getScrollRatio() - scrollRatio) * 0.08;

            let skyColor;
            if (scrollRatio < 0.55) {
                skyColor = lerpColor(5, 7, 13, 217, 59, 0, scrollRatio / 0.55);
            } else {
                skyColor = lerpColor(217, 59, 0, 2, 136, 209, (scrollRatio - 0.55) / 0.45);
            }

            ctx.fillStyle = skyColor;
            ctx.fillRect(0, 0, width, height);

            if (scrollRatio > 0.30 && scrollRatio < 0.75) {
                const maghribAlpha = Math.sin((scrollRatio - 0.30) / 0.45 * Math.PI);
                const horizGlow = ctx.createLinearGradient(0, height * 0.2, 0, height * 0.8);
                horizGlow.addColorStop(0, `rgba(255, 90, 0, ${0.45 * maghribAlpha})`);
                horizGlow.addColorStop(0.5, `rgba(180, 30, 60, ${0.3 * maghribAlpha})`);
                horizGlow.addColorStop(1, `rgba(0, 0, 0, 0)`);
                ctx.fillStyle = horizGlow;
                ctx.fillRect(0, 0, width, height);
            }

            const sunMoonX = width * 0.5;
            const sunMoonY = 120 + scrollRatio * 40;
            const bodyRadius = 60 + scrollRatio * 15;

            if (scrollRatio < 0.65) {
                const moonFade = Math.max(0, 1.0 - (scrollRatio / 0.65));
                if (moonFade > 0.01) {
                    const moonGlow = ctx.createRadialGradient(sunMoonX, sunMoonY, 0, sunMoonX, sunMoonY, bodyRadius * 3.2);
                    moonGlow.addColorStop(0, `rgba(220, 240, 255, ${0.6 * moonFade})`);
                    moonGlow.addColorStop(1, `rgba(220, 240, 255, 0)`);
                    ctx.beginPath();
                    ctx.arc(sunMoonX, sunMoonY, bodyRadius * 3.2, 0, Math.PI * 2);
                    ctx.fillStyle = moonGlow;
                    ctx.fill();

                    const moonGrad = ctx.createRadialGradient(sunMoonX - 15, sunMoonY - 15, 5, sunMoonX, sunMoonY, bodyRadius);
                    moonGrad.addColorStop(0, `rgba(255, 255, 255, ${moonFade})`);
                    moonGrad.addColorStop(0.7, `rgba(230, 240, 250, ${moonFade})`);
                    moonGrad.addColorStop(1, `rgba(175, 195, 215, ${moonFade})`);
                    ctx.beginPath();
                    ctx.arc(sunMoonX, sunMoonY, bodyRadius, 0, Math.PI * 2);
                    ctx.fillStyle = moonGrad;
                    ctx.fill();
                }
            }

            const starFade = Math.max(0, 1.0 - (scrollRatio / 0.55));
            if (starFade > 0.01) {
                starList.forEach(s => { s.update(); s.draw(starFade); });
            }

            const cloudFade = Math.min(1.0, Math.max(0, (scrollRatio - 0.35) / 0.65));
            if (cloudFade > 0.01) {
                const isMaghrib = scrollRatio >= 0.35 && scrollRatio <= 0.65;
                cloudList.forEach(c => { c.update(); c.draw(cloudFade, isMaghrib); });
            }

            requestAnimationFrame(renderLoop);
        }

        window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
        window.addEventListener('scroll', getScrollRatio, { passive: true });

        document.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            initParticles();
            renderLoop();
            renderItems(currentSubtab);
            loadBotPricing();
        });
    </script>
