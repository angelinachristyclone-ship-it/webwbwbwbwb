<!DOCTYPE html>

        :root {
            --bg-color: #05070d;
            --sidebar-bg: rgba(18, 23, 34, 0.85);
            --chat-bg: transparent;
            --panel-bg: rgba(17, 21, 32, 0.9);
            --text-main: #ffffff;
            --text-sub: #8a96a3;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-blue: #2aabee;
            --msg-bubble-bg: rgba(24, 34, 45, 0.85);
            --msg-bubble-text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        /* --- CANVAS STAR ANIMATION BACKGROUND --- */
        #star-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* --- SIDEBAR KIRI (61 MEMBER PM) --- */

            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            height: 100vh;
            flex-shrink: 0;
            z-index: 2;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .user-badge {
            font-size: 12px;
            color: var(--accent-blue);
            background: rgba(42, 171, 238, 0.15);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .member-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .member-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s ease;
            position: relative;
        }

        .member-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .member-item.active {
            background: rgba(42, 171, 238, 0.18);
        }

        .member-item.team-dream {
            border-left: 3px solid #00b4ff;
        }
        .member-item.team-passion {
            border-left: 3px solid #ff1e3c;
        }
        .member-item.team-love {
            border-left: 3px solid #ff0080;
        }
        .member-item.team-default {
            border-left: 3px solid #8a96a3;
        }

        .member-avatar-wrap {
            position: relative;
            width: 48px;
            height: 48px;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .member-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #202736;
        }

        .member-avatar.grey {
            filter: grayscale(100%);
            opacity: 0.55;
        }

        .lock-icon-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #111520;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            border: 1px solid var(--border-color);
        }

        .member-info {
            flex: 1;
            overflow: hidden;
        }

        .member-name {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .member-status {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .member-status.active-sub {
            color: #00c993;
            font-weight: 600;
        }

        /* --- CHAT CONTAINER MAIN --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            position: relative;
            height: 100vh;
            z-index: 1;
        }

        .chat-header {
            height: 64px;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--sidebar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2;
        }

        .header-member-info {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .header-member-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 12px;
            object-fit: cover;
        }

        .header-member-name {
            font-size: 16px;
            font-weight: 700;
        }

        .header-member-sub {
            font-size: 12px;
            color: var(--text-sub);
        }

            border: 1px solid var(--border-color);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
            width: 170px;
            transition: all 0.3s ease;
        }

        .chat-search-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-blue);
            width: 220px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* --- LIGHTBOX MODAL FULLSCREEN PREVIEW --- */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            transition: color 0.2s ease;
        }

        .lightbox-close:hover {
            color: #ff4d4d;
        }

        .lightbox-content-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90vw;
            max-height: 85vh;
        }

        /* --- PEMISAH TANGGAL (DATE DIVIDER STICKER TELEGRAM STYLE) --- */
        .date-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 16px 0;
            position: relative;
        }

        .date-badge {
            background: rgba(0, 0, 0, 0.55);
            color: #a0aab5;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            letter-spacing: 0.5px;
        }

        .save-media-btn {
            display: inline-block;
            margin-top: 4px;
            font-size: 11px;
            color: #2aabee;
            text-decoration: none;
            background: rgba(42, 171, 238, 0.15);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(42, 171, 238, 0.3);
            transition: all 0.2s ease;
        }

        .save-media-btn:hover {
            background: rgba(42, 171, 238, 0.3);
            color: #ffffff;
        }

        /* BUBBLE CHAT TELEGRAM STYLE */
        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 70%;
            margin-bottom: 6px;
        }

        .msg-bubble {
            background: var(--msg-bubble-bg);
            color: var(--msg-bubble-text);
            padding: 10px 14px;
            border-radius: 14px;
            border-bottom-left-radius: 4px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
            backdrop-filter: blur(8px);
        }

        .msg-media {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .msg-timestamp {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 4px;
            align-self: flex-start;
        }

        .unsubscribed-notice {
            margin: auto;
            text-align: center;
            max-width: 380px;
            padding: 30px;
            background: rgba(20, 25, 35, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            backdrop-filter: blur(12px);
        }

        .unsubscribed-notice h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ff4d4d;
        }

        .unsubscribed-notice p {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .order-btn {
            display: inline-block;
            background: var(--accent-blue);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        /* --- MEDIA TABS IN PANEL --- */
        .media-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
        }

        .media-tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .media-tab-btn.active {
            color: #ffffff;
            border-bottom: 2px solid var(--accent-blue);
            background: rgba(42, 171, 238, 0.1);
        }

        /* --- PANEL MEDIA SUB TAB (SLIDE OVERLAY) --- */
        .media-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 340px;
            height: 100vh;
            background: rgba(12, 16, 26, 0.95);
            border-left: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.6);
        }

        .media-panel.open {
            transform: translateX(0);
        }

        .media-panel-header {
            padding: 18px;
            border-bottom: 1px solid var(--border-color);
            font-size: 16px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-panel-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .close-panel-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .media-grid {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .media-grid-item {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .media-grid-item:hover {
            transform: scale(1.05);
        }
    </style>
</head>

        let subscribedFolders = [];

        function getCookie(name) {
            let nameEQ = name + "="; let ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i]; while (c.charAt(0) === ' ') c = c.substring(1);
                if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length));
            }
            return null;
        }

        function logout() {
            document.cookie = "user_session_pm=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.href = "../";
        }

        async function initPage() {
            const session = getCookie("user_session_pm");
            if (!session) {
                window.location.href = "../";
                return;
            }

            try {
                const res = await fetch(BACKEND_URL + "/pm/userpmstat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_cookie: session })
                });
                const data = await res.json();

                if (res.ok && data.ok) {
                    subscribedFolders = (data.subscriptions || []).map(s => s.folder_name.toUpperCase());
                    document.getElementById("userBadge").innerText = data.nama || "Convenant VIP";
                    renderMemberList();
                } else {
                    logout();
                }
            } catch (e) {
                console.error("Init Error:", e);
                renderMemberList();
            }
        }

        async function downloadBlobMedia(mediaUrl, filename) {
            try {
                const res = await fetch(mediaUrl);
                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = blobUrl;
                a.download = filename || "pm_media";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch(e) {
                window.open(mediaUrl, '_blank');
            }
        }

        // --- RENDER CHAT DENGAN PEMISAH TANGGAL & HARI ---
        function formatDateHeader(dateStr) {
            if (!dateStr) return "";
            const d = new Date(dateStr.replace(/-/g, '/'));
            if (isNaN(d.getTime())) return dateStr;
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return d.toLocaleDateString('id-ID', options);
        }

        function buildMessageNode(msg) {
            let timeOnly = msg.timestamp;
            if (msg.timestamp && msg.timestamp.includes(" ")) {
                const parts = msg.timestamp.split(" ");
                timeOnly = parts[1] || msg.timestamp;
            }

            let mediaTag = "";
            if (msg.has_media) {
                const mediaSrc = BACKEND_URL + "/pm/media/" + msg.id;
                if (msg.media_type === 'photo') {
                    mediaTag = `
                        <div style="position:relative;">
                            <img src="${mediaSrc}" class="msg-media" alt="Foto PM" onclick="openLightbox('${mediaSrc}', 'photo', 'pm_photo_${msg.id}.jpg')">
                            <button class="save-media-btn" onclick="openLightbox('${mediaSrc}', 'photo', 'pm_photo_${msg.id}.jpg')">🔍 Detail / 💾 Simpan Foto</button>
                        </div>`;
                } else if (msg.media_type === 'video') {
                    mediaTag = `
                        <div style="position:relative;">
                            <video src="${mediaSrc}" class="msg-media" controls preload="metadata" onclick="openLightbox('${mediaSrc}', 'video', 'pm_video_${msg.id}.mp4')"></video>
                            <button class="save-media-btn" onclick="openLightbox('${mediaSrc}', 'video', 'pm_video_${msg.id}.mp4')">🔍 Detail / 💾 Simpan Video</button>
                        </div>`;
                } else if (msg.media_type === 'audio') {
                    mediaTag = `
                        <div style="background:rgba(0,0,0,0.2); padding:8px; border-radius:8px; margin-bottom:6px;">
                            <audio src="${mediaSrc}" controls style="width:100%; margin-bottom:4px;"></audio>
                            <button class="save-media-btn" style="font-size:11px;" onclick="openLightbox('${mediaSrc}', 'audio', 'pm_audio_${msg.id}.m4a')">💾 Detail / Simpan Voice/Audio</button>
                        </div>`;
                }
            }

            return `
                <div class="msg-row">
                    <div class="msg-bubble">
                        ${mediaTag}
                        <div>${(msg.text || "").replace(/\n/g, '<br>')}</div>
                    </div>
                    <div class="msg-timestamp">[${timeOnly}]</div>
                </div>
            `;
        }

        function renderMessages(messages) {
            const chatMessages = document.getElementById("chatMessages");
            
            if (messages.length === 0) {
                chatMessages.innerHTML = `<div style="margin:auto; color:var(--text-sub);">Belum ada riwayat pesan PM.</div>`;
                return;
            }

            let msgHtml = "";
            let lastDate = "";

            // Render pesan (terlama di atas, terbaru di bawah)
            messages.slice().reverse().forEach(msg => {
                let currentDate = "";
                if (msg.timestamp && msg.timestamp.includes(" ")) {
                    currentDate = msg.timestamp.split(" ")[0];
                }

                if (currentDate && currentDate !== lastDate) {
                    const formattedDateStr = formatDateHeader(currentDate);
                    msgHtml += `<div class="date-divider"><span class="date-badge">${formattedDateStr}</span></div>`;
                    lastDate = currentDate;
                }

                msgHtml += buildMessageNode(msg);
            });

            chatMessages.innerHTML = msgHtml;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // --- INFINITE SCROLL PAGINATION (SCROLL KE ATAS UNTUK MEMUAT CHAT LAMA) ---
        async function loadOlderMessages() {
            if (isLoadingMore || !hasMoreMessages || !activeMember || oldestMsgId === 0) return;
            
            isLoadingMore = true;
            const chatMessages = document.getElementById("chatMessages");
            const previousScrollHeight = chatMessages.scrollHeight;

            const loaderDiv = document.createElement("div");
            loaderDiv.id = "scrollLoader";
            loaderDiv.style.textAlign = "center";
            loaderDiv.style.color = "var(--text-sub)";
            loaderDiv.style.padding = "10px";
            loaderDiv.style.fontSize = "12px";
            loaderDiv.innerText = "⏳ Memuat pesan lama...";
            chatMessages.insertBefore(loaderDiv, chatMessages.firstChild);

            const session = getCookie("user_session_pm");
            try {
                const res = await fetch(BACKEND_URL + "/pm/getpmmessages", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session_cookie: session,
                        folder_name: activeMember.name,
                        limit: 50,
                        offset_id: oldestMsgId
                    })
                });
                const data = await res.json();
                const loader = document.getElementById("scrollLoader");
                if (loader) loader.remove();

                if (res.ok && data.ok && data.messages && data.messages.length > 0) {
                    const olderMsgs = data.messages;
                    if (olderMsgs.length < 50) hasMoreMessages = false;
                    oldestMsgId = olderMsgs[olderMsgs.length - 1].id;

                    // Sisipkan pesan-pesan lama di bagian atas
                    const tempDiv = document.createElement("div");
                    let prependHtml = "";
                    let lastDate = "";

                    olderMsgs.slice().reverse().forEach(msg => {
                        let currentDate = "";
                        if (msg.timestamp && msg.timestamp.includes(" ")) {
                            currentDate = msg.timestamp.split(" ")[0];
                        }
                        if (currentDate && currentDate !== lastDate) {
                            const formattedDateStr = formatDateHeader(currentDate);
                            prependHtml += `<div class="date-divider"><span class="date-badge">${formattedDateStr}</span></div>`;
                            lastDate = currentDate;
                        }
                        prependHtml += buildMessageNode(msg);
                    });

                    tempDiv.innerHTML = prependHtml;
                    while (tempDiv.firstChild) {
                        chatMessages.insertBefore(tempDiv.firstChild, chatMessages.firstChild);
                    }

                    // Jaga posisi scroll agar tidak melompat
                    const newScrollHeight = chatMessages.scrollHeight;
                    chatMessages.scrollTop = newScrollHeight - previousScrollHeight;
                } else {
                    hasMoreMessages = false;
                }
            } catch (e) {
                const loader = document.getElementById("scrollLoader");
                if (loader) loader.remove();
            } finally {
                isLoadingMore = false;
            }
        }

        // --- ANIMASI BINTANG STAR-CANVAS BACKGROUND ---
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, stars = [];

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }

        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random();
                this.speed = Math.random() * 0.01 + 0.005;
            }
            update() {
                this.alpha += this.speed;
                if (this.alpha > 1 || this.alpha < 0) this.speed = -this.speed;
            }
            draw() {
                ctx.fillStyle = currentStarColor;
                ctx.globalAlpha = Math.abs(this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function initStars() {
            resize();
            stars = [];
            const count = Math.floor((width * height) / 3000);
            for (let i = 0; i < count; i++) stars.push(new Star());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        // --- WEBSOCKET REAL-TIME BROADCAST LISTENER + BROWSER NOTIFICATION ---
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        function triggerWebNotification(memberName, textContent) {
            if ("Notification" in window && Notification.permission === "granted") {
                const title = `📩 Pesan PM Baru dari ${memberName}`;
                const options = {
                    body: textContent || "Member baru saja mengirimkan pesan/media baru di Convenant PM!"
                };
                new Notification(title, options);
            }
        }

        let wsRetryCount = 0;
        const MAX_WS_RETRIES = 5;

        function setupWebSocket() {
            const session = getCookie("user_session_pm");
            if (!session) return;
            if (wsRetryCount >= MAX_WS_RETRIES) {
                console.warn("[WebSocket] Reached maximum reconnection attempts. Stopping polling to prevent rate limits.");
                return;
            }

            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = BACKEND_URL.replace(/^http/, 'ws') + "/pm/ws/" + session;

            try {
                const ws = new WebSocket(wsUrl);

                ws.onopen = function() {
                    wsRetryCount = 0; // Reset counter saat koneksi sukses
                };

                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    const memName = data.folder_name || "Member PM";

                    // Kirim Notifikasi Browser ke User yang sedang berlangganan
                    triggerWebNotification(memName, data.text);

                    if (activeMember && data.folder_name && data.folder_name.toUpperCase() === activeMember.name.toUpperCase()) {
                        const chatMessages = document.getElementById("chatMessages");
                        const timeOnly = data.timestamp ? data.timestamp.split(" ")[1] || data.timestamp : "";
                        
                        let mediaTag = "";
                        if (data.has_media) {
                            const mediaSrc = BACKEND_URL + "/pm/media/" + data.id;
                            if (data.media_type === 'photo') {
                                mediaTag = `<div style="position:relative;"><img src="${mediaSrc}" class="msg-media" alt="Foto PM"><a href="${mediaSrc}" download class="save-media-btn">💾 Simpan Foto</a></div>`;
                            } else if (data.media_type === 'video') {
                                mediaTag = `<div style="position:relative;"><video src="${mediaSrc}" class="msg-media" controls></video><a href="${mediaSrc}" download class="save-media-btn">💾 Simpan Video</a></div>`;
                            } else if (data.media_type === 'audio') {
                                mediaTag = `<div style="background:rgba(0,0,0,0.2); padding:8px; border-radius:8px; margin-bottom:6px;"><audio src="${mediaSrc}" controls style="width:100%; margin-bottom:4px;"></audio><a href="${mediaSrc}" download class="save-media-btn" style="font-size:11px;">💾 Simpan Voice/Audio</a></div>`;
                            }
                        }

                        const newMsgNode = document.createElement("div");
                        newMsgNode.className = "msg-row";
                        newMsgNode.innerHTML = `
                            <div class="msg-bubble">
                                ${mediaTag}
                                <div>${(data.text || "").replace(/\n/g, '<br>')}</div>
                            </div>
                            <div class="msg-timestamp">[${timeOnly}]</div>
                        `;
                        chatMessages.appendChild(newMsgNode);
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }
                };

                ws.onclose = function() {
                    wsRetryCount++;
                    const delay = Math.min(30000, 5000 * wsRetryCount);
                    if (wsRetryCount <= MAX_WS_RETRIES) {
                        setTimeout(setupWebSocket, delay);
                    }
                };
            } catch (e) {
                console.log("WebSocket connection error:", e);
            }
        }

        window.addEventListener('resize', initStars);
        initStars();
        animate();
        setupWebSocket();
        requestNotificationPermission();
    </script>
</body>
</html>
