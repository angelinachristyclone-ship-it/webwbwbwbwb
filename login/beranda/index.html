<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Convenant VIP — Archive PM JKT48</title>
    <link rel="stylesheet" href="style.css?v=21.0">
</head>
<body>
    <div class="app-shell">
        <!-- SIDEBAR KIRI: DAFTAR MEMBER -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <div class="sidebar-title-wrap">
                    <h1 class="sidebar-title">Archive PM JKT48</h1>
                    <span id="userBadge" class="user-badge">Convenant VIP</span>
                </div>
                <div class="member-search">
                    <input type="text" id="memberSearchInput" class="member-search-input" placeholder="🔍 Cari oshi kamu..." oninput="filterMemberList()">
                </div>
            </header>
            <div id="memberList" class="member-list">
                <!-- Member cards rendered dynamically via JS -->
            </div>
        </aside>

        <!-- MAIN CHAT AREA -->
        <main class="chat-area">
            <header class="chat-header">
                <button id="backToSidebarBtn" class="back-sidebar-btn" onclick="showSidebarMobile()" title="Kembali">←</button>
                <div class="header-member-info">
                    <img id="headerAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231f293d'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='40' fill='%237b71c6'%3E👤%3C/text%3E%3C/svg%3E" class="header-member-avatar" alt="Avatar">
                    <div class="header-text-group">
                        <div id="headerName" class="header-member-name">Memuat PM...</div>
                        <div id="headerSub" class="header-member-sub">Convenant VIP Archive</div>
                    </div>
                </div>
            </header>

            <div id="chatMessages" class="chat-messages">
                <div class="unsubscribed-notice">
                    <h3>⏳ Memuat Halaman...</h3>
                </div>
            </div>

            <!-- CHAT COMPOSER -->
            <footer class="chat-composer-bar">
                <div class="composer-input-row">
                    <input type="text" id="commentInput" class="composer-input" placeholder="Tulis komentar / balasan..." onkeydown="if(event.key==='Enter') sendComment()">
                    <button id="sendCommentBtn" class="composer-send-btn" onclick="sendComment()">➤</button>
                </div>
            </footer>
        </main>
    </div>

    <script src="app.js?v=21.0"></script>
</body>
</html>
