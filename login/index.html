<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TMMDZ0QC24"></script>
    <script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Convenant VIP — Login PM Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.35);
            --glass-card: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.75);
            --glass-border-hover: rgba(255, 255, 255, 0.95);
            --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(255, 255, 255, 0.6) inset;
            --text-dark: #0f172a;
            --text-sub: #475569;
            --accent-blue: #0284c7;
            --accent-glow: rgba(255, 255, 255, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #e8edf3 0%, #f8fafc 50%, #e2e8f0 100%);
            color: var(--text-dark);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            user-select: none;
            padding: 20px 16px;
        }

        #ambient-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 5;
            text-align: center;
            animation: fadeInCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .back-nav-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }
        .back-nav-link:hover {
            color: var(--text-dark);
            background: rgba(255, 255, 255, 0.8);
            transform: translateX(-3px);
        }

        /* Collab Header Card */
        .login-header-box {
            background: var(--glass-card);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1.5px solid var(--glass-border);
            border-radius: 22px;
            padding: 18px 24px 14px;
            box-shadow: var(--glass-shadow);
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .brand-logo-img {
            max-height: 48px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
        }

        .collab-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 2px;
        }

        .collab-x {
            font-size: 15px;
            font-weight: 900;
            color: #ef4444;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .shinistrus-calligraphy {
            font-family: 'Great Vibes', cursive;
            font-size: 32px;
            font-weight: 400;
            color: #0f172a;
            letter-spacing: 1px;
            line-height: 1.1;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
        }

        .header-subtext {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        /* Login Card */
        .login-card {
            background: var(--glass-card);
            border: 1.5px solid var(--glass-border);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .login-card:hover {
            border-color: var(--glass-border-hover);
        }

        .card-heading {
            font-size: 19px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .card-subheading {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 22px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 7px;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .input-field {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.65);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 14px;
            color: var(--text-dark);
            font-size: 14.5px;
            font-weight: 600;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .input-field:focus {
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
        }

        .error-msg {
            color: #dc2626;
            font-size: 12.5px;
            font-weight: 700;
            margin-bottom: 16px;
            display: none;
            background: rgba(239, 68, 68, 0.12);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            text-align: left;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.2);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            box-shadow: 0 10px 28px rgba(2, 132, 199, 0.35);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .hint-box {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.5;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.65);
            padding: 10px 14px;
            border-radius: 12px;
        }

        .hint-box code {
            background: rgba(2, 132, 199, 0.12);
            color: var(--accent-blue);
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 800;
        }
    
/* UNIVERSAL WHITE TRANSPARENT GLASSMORPHISM FOR ALL CARDS & BUTTONS */
.game-text-card, .voucher-cat-card, .nominal-item-card, .nominal-item, .nominal-card,
.payment-card, .method-card, .step-card, .btn-lelang-nominal, .nav-cat-btn {
    background: rgba(255, 255, 255, 0.42) !important;
    border: 1.5px solid rgba(255, 255, 255, 0.75) !important;
    backdrop-filter: blur(16px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06), inset 0 1px 2px rgba(255, 255, 255, 0.6) !important;
    color: #0f172a !important;
    transition: all 0.25s ease !important;
}

.game-text-card:hover, .voucher-cat-card:hover, .nominal-item-card:hover, .nominal-item:hover,
.nominal-card:hover, .payment-card:hover, .method-card:hover, .step-card:hover, .btn-lelang-nominal:hover, .nav-cat-btn:hover {
    background: rgba(255, 255, 255, 0.62) !important;
    border-color: rgba(255, 255, 255, 0.98) !important;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1), inset 0 1px 3px rgba(255, 255, 255, 0.8) !important;
    transform: translateY(-2px) !important;
}

.voucher-cat-card.active, .nominal-item-card.active, .nominal-item.selected,
.payment-card.selected, .method-card.selected, .btn-lelang-nominal.active {
    background: rgba(255, 255, 255, 0.68) !important;
    border-color: #0284c7 !important;
    box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.35), 0 10px 25px rgba(0, 0, 0, 0.08) !important;
}

.back-nav, .back-nav-link, .nav-cat-btn.home-btn, .btn-kembali {
    background: rgba(255, 255, 255, 0.38) !important;
    border: 1.5px solid rgba(255, 255, 255, 0.7) !important;
    backdrop-filter: blur(16px) !important;
    -webkit-backdrop-filter: blur(16px) !important;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06), inset 0 1px 2px rgba(255, 255, 255, 0.6) !important;
    color: #0f172a !important;
}

.back-nav:hover, .back-nav-link:hover, .nav-cat-btn.home-btn:hover, .btn-kembali:hover {
    background: rgba(255, 255, 255, 0.6) !important;
    border-color: rgba(255, 255, 255, 0.95) !important;
}

.game-detail-box, .section-card, .detail-box, .login-card, .login-header-box, .page-brand-box {
    background: rgba(255, 255, 255, 0.45) !important;
    border: 1.5px solid rgba(255, 255, 255, 0.75) !important;
    backdrop-filter: blur(28px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(28px) saturate(180%) !important;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08), inset 0 2px 4px rgba(255, 255, 255, 0.6) !important;
    color: #0f172a !important;
}

.input-text, .form-control, .input-field, .form-input-modern {
    background: rgba(255, 255, 255, 0.5) !important;
    border: 1.5px solid rgba(255, 255, 255, 0.75) !important;
    color: #0f172a !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
}

.input-text:focus, .form-control:focus, .input-field:focus, .form-input-modern:focus {
    background: rgba(255, 255, 255, 0.7) !important;
    border-color: #0284c7 !important;
}

    </style>
</head>
<body>
    <canvas id="ambient-canvas"></canvas>

    <div class="login-container">
        <a href="../" class="back-nav-link">⬅️ Kembali ke Beranda</a>

        <!-- COLLAB HEADER CARD -->
        <div class="login-header-box">
            <img src="../web asset/logo.png" alt="Convenant Logo" class="brand-logo-img">
            <div class="collab-row">
                <span class="collab-x">✕</span>
                <span class="shinistrus-calligraphy">ShinistrusPay</span>
            </div>
            <div class="header-subtext">Archive PM JKT48 & VIP Store Portal</div>
        </div>

        <div class="login-card">
            <h2 class="card-heading">Masuk ke Portal PM</h2>
            <p class="card-subheading">Masukkan ID Telegram dan Password akun kamu</p>

            <div class="input-group">
                <label class="input-label" for="userId">Telegram ID</label>
                <input type="text" id="userId" class="input-field" placeholder="Contoh: 123456789" autocomplete="off">
            </div>

            <div class="input-group">
                <label class="input-label" for="password">Password</label>
                <input type="password" id="password" class="input-field" placeholder="Masukkan Password akun" autocomplete="current-password">
            </div>

            <div id="errorMsg" class="error-msg"></div>

            <button id="loginBtn" class="login-btn" onclick="handleLogin()">MASUK KE PORTAL</button>

            <div class="hint-box">
                Belum punya akun atau password? Kirim <code>/regis</code> ke PM Bot Telegram kami untuk mendaftar!
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = (window.BACKEND_URL || window.CORE_BACKEND_URL || "https://shinezzzz-iddiletele.hf.space").replace(/\/$/, "");

        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1);
                if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length));
            }
            return null;
        }

        function setCookie(name, value, days) {
            let d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            let expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + encodeURIComponent(value) + ";" + expires + ";path=/;SameSite=Lax";
        }

        async function checkSession() {
            const session = getCookie("user_session_pm");
            if (!session) return;
            try {
                const res = await fetch(BACKEND_URL + "/pm/cekseasonpm", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_cookie: session })
                });
                const data = await res.json();
                if (data.valid) {
                    window.location.href = "./beranda/";
                }
            } catch (e) {
                console.log("Cek session error:", e);
            }
        }

        async function handleLogin() {
            const userId = document.getElementById("userId").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("errorMsg");
            const loginBtn = document.getElementById("loginBtn");

            errorMsg.style.display = "none";

            if (!userId || !password) {
                errorMsg.innerText = "❌ Telegram ID dan Password wajib diisi!";
                errorMsg.style.display = "block";
                return;
            }

            loginBtn.innerText = "⏳ MEMPROSES...";
            loginBtn.disabled = true;

            try {
                const res = await fetch(BACKEND_URL + "/pm/loginpm", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: userId, password: password })
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    setCookie("user_session_pm", data.session_key, 7);
                    window.location.href = "./beranda/";
                } else {
                    errorMsg.innerText = "❌ " + (data.msg || "Login gagal. Cek ID dan Password!");
                    errorMsg.style.display = "block";
                }
            } catch (e) {
                errorMsg.innerText = "❌ Gagal terhubung ke server backend.";
                errorMsg.style.display = "block";
            } finally {
                loginBtn.innerText = "MASUK KE PORTAL";
                loginBtn.disabled = false;
            }
        }

        document.addEventListener("keydown", function(e) {
            if (e.key === "Enter") handleLogin();
        });

        window.addEventListener("DOMContentLoaded", checkSession);

        // Ambient Wind Particles Canvas
        (function() {
            const canvas = document.getElementById('ambient-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            });

            const particles = [];
            const count = 35;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 7 + 4,
                    speedX: Math.random() * 1.5 + 0.8,
                    speedY: Math.random() * 0.8 + 0.4,
                    angle: Math.random() * Math.PI * 2,
                    spin: (Math.random() - 0.5) * 0.03,
                    color: i % 2 === 0
                        ? `rgba(255, 182, 193, ${Math.random() * 0.35 + 0.25})`
                        : `rgba(180, 220, 240, ${Math.random() * 0.35 + 0.25})`
                });
            }

            function draw(p) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.moveTo(0, -p.size);
                ctx.bezierCurveTo(p.size * 0.8, -p.size * 0.3, p.size * 0.8, p.size * 0.6, 0, p.size);
                ctx.bezierCurveTo(-p.size * 0.8, p.size * 0.6, -p.size * 0.8, -p.size * 0.3, 0, -p.size);
                ctx.fill();
                ctx.restore();
            }

            function anim() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    p.angle += p.spin;
                    if (p.x > w + 20) p.x = -20;
                    if (p.y > h + 20) { p.y = -20; p.x = Math.random() * w; }
                    draw(p);
                });
                requestAnimationFrame(anim);
            }
            anim();
        })();
    </script>
</body>
</html>
